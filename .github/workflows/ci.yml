name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  lint-and-test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v3
      - name: Set up Python
        run: uv python install 3.12
      - name: Install deps
        run: uv pip install --system -r requirements-dev.txt
      - name: Ruff
        run: ruff check .
      - name: Pytest
        run: pytest -q
        env:
          DEBUG: "True"
          SECRET_KEY: ci-secret-key-not-for-production-only-0123456789abc
          GROQ_API_KEY: ci-test
          SAHARA_API_KEY: ci-test

  migrations:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: kare
        ports: ["5432:5432"]
        options: >-
          --health-cmd pg_isready --health-interval 10s
          --health-timeout 5s --health-retries 5
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v3
      - run: uv python install 3.12
      - run: uv pip install --system -r requirements.txt
      - name: alembic upgrade head
        env:
          DATABASE_URL: postgresql://postgres:postgres@localhost:5432/kare
          SECRET_KEY: ci-secret-key-not-for-production-only-0123456789abc
        run: |
          alembic upgrade head
          alembic check   # fails if models drifted from migrations
